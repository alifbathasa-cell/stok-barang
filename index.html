<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StokKu - Manajemen Inventaris</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel for Browser Parsing -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- HTML5 QR Code Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        #reader__scan_region video { border-radius: 1rem; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useRef } = React;
        // Mock icons component for Lucide integration in browser
        const Icon = ({ name, size = 20, className = "" }) => {
            const [svg, setSvg] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const icon = window.lucide.icons[name];
                    if (icon) {
                        const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}">${icon}</svg>`;
                        setSvg(svgString);
                    }
                }
            }, [name, size, className]);
            return <span dangerouslySetInnerHTML={{ __html: svg }} />;
        };

        const App = () => {
            const [items, setItems] = useState([
                { id: 1, barcode: '899123456701', name: 'Kertas A4 80gr', category: 'Alat Tulis', stock: 45, unit: 'Rim', price: 55000, minStock: 10 },
                { id: 2, barcode: '899123456702', name: 'Tinta Printer Hitam', category: 'Elektronik', stock: 5, unit: 'Botol', price: 95000, minStock: 8 },
                { id: 3, barcode: '899123456703', name: 'Laptop Pro 14', category: 'Elektronik', stock: 12, unit: 'Unit', price: 15000000, minStock: 3 }
            ]);

            const [searchTerm, setSearchTerm] = useState('');
            const [filterCategory, setFilterCategory] = useState('Semua');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [isScannerOpen, setIsScannerOpen] = useState(false);
            const [editingItem, setEditingItem] = useState(null);
            const html5QrCode = useRef(null);

            const [formData, setFormData] = useState({
                barcode: '', name: '', category: '', stock: 0, unit: '', price: 0, minStock: 5
            });

            const categories = ['Semua', ...new Set(items.map(item => item.category))];
            const filteredItems = useMemo(() => {
                return items.filter(item => {
                    const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase()) || (item.barcode && item.barcode.includes(searchTerm));
                    return (filterCategory === 'Semua' || item.category === filterCategory) && matchesSearch;
                });
            }, [items, searchTerm, filterCategory]);

            const stats = {
                total: items.length,
                low: items.filter(i => i.stock > 0 && i.stock <= i.minStock).length,
                empty: items.filter(i => i.stock === 0).length,
                value: items.reduce((acc, curr) => acc + (curr.price * curr.stock), 0)
            };

            const startScanner = async () => {
                setIsScannerOpen(true);
                setTimeout(() => {
                    html5QrCode.current = new Html5Qrcode("reader");
                    html5QrCode.current.start(
                        { facingMode: "environment" }, 
                        { fps: 10, qrbox: 250 },
                        (text) => handleScanSuccess(text)
                    ).catch(err => console.error(err));
                }, 300);
            };

            const stopScanner = async () => {
                if (html5QrCode.current?.isScanning) await html5QrCode.current.stop();
                setIsScannerOpen(false);
            };

            const handleScanSuccess = (text) => {
                stopScanner();
                const found = items.find(i => i.barcode === text);
                if (found) {
                    setSearchTerm(text);
                    handleOpenModal(found);
                } else {
                    handleOpenModal(null, text);
                }
            };

            const handleOpenModal = (item = null, scannedBarcode = '') => {
                if (item) {
                    setEditingItem(item);
                    setFormData({ ...item });
                } else {
                    setEditingItem(null);
                    setFormData({ barcode: scannedBarcode, name: '', category: '', stock: 0, unit: '', price: 0, minStock: 5 });
                }
                setIsModalOpen(true);
            };

            const handleSave = (e) => {
                e.preventDefault();
                if (editingItem) {
                    setItems(items.map(i => i.id === editingItem.id ? { ...formData, id: i.id } : i));
                } else {
                    setItems([...items, { ...formData, id: Date.now() }]);
                }
                setIsModalOpen(false);
            };

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto">
                    <header className="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <div>
                            <h1 className="text-3xl font-bold text-slate-800 flex items-center gap-2">StokKu</h1>
                            <p className="text-slate-500">Inventory & Barcode Scanner</p>
                        </div>
                        <div className="flex gap-2 w-full md:w-auto">
                            <button onClick={startScanner} className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-white border-2 border-blue-600 text-blue-600 px-4 py-2 rounded-xl font-bold">
                                <Icon name="ScanLine" /> Scan
                            </button>
                            <button onClick={() => handleOpenModal()} className="flex-1 md:flex-none flex items-center justify-center gap-2 bg-blue-600 text-white px-4 py-2 rounded-xl font-bold shadow-lg shadow-blue-200">
                                <Icon name="Plus" /> Tambah
                            </button>
                        </div>
                    </header>

                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
                        <StatCard title="Total" value={stats.total} color="bg-blue-50" icon="Package" />
                        <StatCard title="Menipis" value={stats.low} color="bg-amber-50" icon="AlertTriangle" />
                        <StatCard title="Habis" value={stats.empty} color="bg-red-50" icon="X" />
                        <StatCard title="Nilai" value={`Rp ${stats.value.toLocaleString()}`} color="bg-emerald-50" icon="ArrowUpRight" />
                    </div>

                    <div className="bg-white p-4 rounded-2xl border mb-6 flex flex-col md:flex-row gap-4">
                        <input 
                            type="text" placeholder="Cari barang atau barcode..." 
                            className="flex-1 bg-slate-50 border p-2 rounded-lg"
                            value={searchTerm} onChange={e => setSearchTerm(e.target.value)}
                        />
                        <select className="bg-slate-50 border p-2 rounded-lg" value={filterCategory} onChange={e => setFilterCategory(e.target.value)}>
                            {categories.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                    </div>

                    <div className="bg-white rounded-2xl border overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-slate-50 text-slate-600 text-sm">
                                <tr>
                                    <th className="p-4">Produk</th>
                                    <th className="p-4">Stok</th>
                                    <th className="p-4">Status</th>
                                    <th className="p-4 text-right">Aksi</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y">
                                {filteredItems.map(item => (
                                    <tr key={item.id} className="hover:bg-slate-50">
                                        <td className="p-4">
                                            <div className="font-bold">{item.name}</div>
                                            <div className="text-xs text-slate-400 font-mono">{item.barcode}</div>
                                        </td>
                                        <td className="p-4">{item.stock} {item.unit}</td>
                                        <td className="p-4">
                                            {item.stock <= 0 ? <span className="text-red-500 font-bold text-xs">HABIS</span> : 
                                             item.stock <= item.minStock ? <span className="text-amber-500 font-bold text-xs">MENIPIS</span> : 
                                             <span className="text-emerald-500 font-bold text-xs">AMAN</span>}
                                        </td>
                                        <td className="p-4 text-right flex justify-end gap-2">
                                            <button onClick={() => handleOpenModal(item)} className="p-2 text-slate-400 hover:text-blue-600"><Icon name="Edit3" size={18} /></button>
                                            <button onClick={() => {if(confirm('Hapus?')) setItems(items.filter(i=>i.id!==item.id))}} className="p-2 text-slate-400 hover:text-red-600"><Icon name="Trash2" size={18} /></button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {isScannerOpen && (
                        <div className="fixed inset-0 z-[100] bg-black/90 flex flex-col items-center justify-center p-4">
                            <div className="bg-white w-full max-w-md rounded-3xl overflow-hidden">
                                <div className="p-4 border-b flex justify-between items-center">
                                    <h3 className="font-bold">Scan Barcode</h3>
                                    <button onClick={stopScanner} className="p-2 bg-slate-100 rounded-full"><Icon name="X" /></button>
                                </div>
                                <div id="reader" className="bg-black"></div>
                                <button onClick={stopScanner} className="w-full p-4 bg-slate-800 text-white font-bold uppercase tracking-widest">Tutup Kamera</button>
                            </div>
                        </div>
                    )}

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <form onSubmit={handleSave} className="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                <h2 className="text-xl font-bold">{editingItem ? 'Edit' : 'Tambah'} Barang</h2>
                                <div className="bg-blue-50 p-3 rounded-xl">
                                    <label className="text-[10px] font-bold text-blue-600">BARCODE</label>
                                    <input className="w-full bg-transparent border-none p-0 focus:ring-0 text-lg font-mono" value={formData.barcode} onChange={e => setFormData({...formData, barcode: e.target.value})} />
                                </div>
                                <input placeholder="Nama Barang" className="w-full border p-2 rounded-lg" value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} required />
                                <div className="grid grid-cols-2 gap-2">
                                    <input placeholder="Kategori" className="border p-2 rounded-lg" value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} required />
                                    <input placeholder="Satuan (Pcs/Rim)" className="border p-2 rounded-lg" value={formData.unit} onChange={e => setFormData({...formData, unit: e.target.value})} required />
                                </div>
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="number" placeholder="Stok" className="border p-2 rounded-lg" value={formData.stock} onChange={e => setFormData({...formData, stock: parseInt(e.target.value)})} required />
                                    <input type="number" placeholder="Min. Stok" className="border p-2 rounded-lg" value={formData.minStock} onChange={e => setFormData({...formData, minStock: parseInt(e.target.value)})} required />
                                </div>
                                <input type="number" placeholder="Harga Jual" className="w-full border p-2 rounded-lg" value={formData.price} onChange={e => setFormData({...formData, price: parseInt(e.target.value)})} required />
                                <button type="submit" className="w-full py-3 bg-blue-600 text-white font-bold rounded-xl shadow-lg">Simpan</button>
                                <button type="button" onClick={() => setIsModalOpen(false)} className="w-full py-2 text-slate-400">Batal</button>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        const StatCard = ({ title, value, icon, color }) => (
            <div className={`${color} p-4 rounded-2xl border border-white flex flex-col`}>
                <div className="flex justify-between items-center mb-1">
                    <span className="text-[10px] font-bold text-slate-500 uppercase">{title}</span>
                    <Icon name={icon} size={16} className="text-slate-400" />
                </div>
                <div className="text-lg font-bold truncate">{value}</div>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
